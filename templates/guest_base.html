<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>{% block title %}{{ t.page_title }} — {{ hotel['hotel_name'] }}{% endblock %}</title>
<script>document.documentElement.classList.add('js')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', path='guest.css') }}?v={{ asset_v }}">
</head>
<body class="guest">
<main class="g-shell">
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="g-flash {{ category }}" role="alert">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.8l2.84 5.75 6.35.92-4.6 4.48 1.09 6.32L12 17.29l-5.68 2.98 1.09-6.32-4.6-4.48 6.35-.92z" stroke-linejoin="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<script src="{{ url_for('static', path='guest.js') }}?v={{ asset_v }}" defer></script>
</body></html>
